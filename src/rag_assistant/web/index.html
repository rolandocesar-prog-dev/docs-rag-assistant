<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Asistente de documentación</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <header class="header">
      <h1>Asistente de documentación</h1>
      <p class="subtitle">
        Responde solo con la documentación de Kubernetes en español y cita cada fuente.
      </p>
    </header>

    <main class="chat">
      <section id="conversation" class="conversation" aria-live="polite" aria-label="Conversación">
        <p class="empty" id="empty">
          Prueba con «¿Qué es un Pod?» o «¿En qué se diferencia un Deployment de un StatefulSet?».
        </p>
      </section>

      <form id="ask-form" class="ask-form">
        <label for="question" class="visually-hidden">Tu pregunta</label>
        <textarea
          id="question"
          name="question"
          rows="2"
          maxlength="1000"
          placeholder="Escribe tu pregunta…"
          required
        ></textarea>
        <div class="form-footer">
          <span id="counter" class="counter" aria-live="off">0 / 1000</span>
          <button type="submit" id="send">Preguntar</button>
        </div>
      </form>
    </main>

    <script src="/static/app.js" defer></script>
  </body>
</html>

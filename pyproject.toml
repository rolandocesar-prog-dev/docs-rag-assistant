[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-assistant"
version = "0.1.0"
description = "Asistente de preguntas y respuestas sobre documentación pública, con RAG y citas a la fuente."
readme = "README.md"
license = "MIT"
authors = [{ name = "Rolando César Vásquez Tavera" }]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.4",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rag_assistant"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Documentos de terceros copiados sin modificar (ver data/SOURCES.md).
extend-exclude = ["data/corpus"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["rag_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=rag_assistant --cov-report=term-missing"

[tool.coverage.report]
# Los puertos son interfaces (Protocol): sus cuerpos `...` nunca se ejecutan.
exclude_also = ["class .*\\(Protocol\\):"]

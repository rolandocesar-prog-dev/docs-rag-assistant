# Servicios de desarrollo (specs/design.md, sección 3).
# Uso: cp .env.example .env  →  docker compose up -d  →  alembic upgrade head
# Ollama va aparte: instalado en el equipo (usa la GPU) o, si no, en Docker con el profile
# `ollama`: docker compose --profile ollama up -d
#           docker compose exec ollama ollama pull bge-m3   (y qwen3.5:4b; una sola vez)
services:
  db:
    image: pgvector/pgvector:0.8.7-pg18
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ${RAG_DB_PASSWORD:?Define RAG_DB_PASSWORD en .env (ver .env.example)}
      POSTGRES_DB: rag
    ports:
      - "127.0.0.1:${RAG_DB_PORT:-5442}:5432"
    volumes:
      - rag-db:/var/lib/postgresql
      # Crea también la base rag_test para las pruebas de integración.
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 3s
      retries: 10

  ollama:
    image: ollama/ollama:0.40.14
    # Opcional: no arranca con `docker compose up` salvo que se pida el profile.
    profiles: [ollama]
    ports:
      - "127.0.0.1:${RAG_OLLAMA_PORT:-11434}:11434"
    volumes:
      - rag-ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  rag-db:
  rag-ollama:
